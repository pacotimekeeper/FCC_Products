
<h1>CHCSJ 實用實付</h1>

<div class="container-data-filter">
    <div class="container-suppliers" style="width: 45%;">
        <div style="display: flex; flex-direction: row;">
            <b>Search by (用途/ 物品編號/ Description)</b>
            <div class="info-wrapper">
                <button class="trigger-btn">ℹ️</button> 
                <!-- This is the part that stays hidden -->
                <div class="info-box">
                    <span class="icon">💡</span>
                    <p>1. Enlisted criteria: Assure Column SAP_Code & CHCSJ_PUBP is filled.</p>
                    <p>2. Diplay purpose: Fill in 用途, CHCSJ_Product_Description, CHCSJ_Modelo and Item_Code
                    <p># Example CHCSJ_Product_Description -> 722022XX BioSure PK Screw SIZE XX x XXmm</p>
                </div>
            </div> 
        </div>
        <q-input v-model="searchText" style="width: 100%"></q-input>
        <q-btn label="SEARCH!" color="primary" v-on:click="btnSearchText = true" style="width: 25%"></q-btn>

    </div>
    
    <div class="container-suppliers">
    <!-- <div> -->
        <b>Suppliers</b>
        <template v-for="supplier in suppliers">
            <q-toggle v-model="selectedSuppliers" :label="supplier" :val="supplier"/>
        </template>
    <!-- </div> -->
    </div>
    
    
</div>


<hr>

<div>
    <table>
        <tr>
            <template v-for="thead in theads">
                <th>{{thead}}</th>
            </template>
        </tr>
        
        <!-- <template v-for="product in products">
            <tr>
                <td v-for="v in product">
                    <span>{{v}}</span>
                </td>
            </tr>
        </template> -->

        <template v-for="product in products" :key="index">
            <tr>
                <!-- <td v-if="getSpanCount(products, index, 'supplier') > 0" 
            :rowspan="getSpanCount(products, index, 'supplier')"> -->
                <td v-if="product.col1_index == 1">
                    {{product.supplier}}
                </td>
                <td v-else></td>

                <td v-if="product.col2_index == 1">
                    {{product.use_case}}
                </td>
                </td>
                <td v-else></td>
                <td>{{product.code}}</td>
                <td>{{product.desc}}</td>
                <td :style="{ color: product.ot_qty < 5 ? 'blue' : 'grey' }">
                    {{product.ot_qty}}
                </td>
            </tr>
        </template>
    </table>
</div>
